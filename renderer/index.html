<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self' file:; img-src 'self' file: data: blob: album-media: https:; media-src 'self' file: data: blob: album-media:; frame-src 'self' file: album-media:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' file: data: blob: album-media: https:; object-src 'none'; worker-src 'self' file: blob:;" />
<title>Luma · 智能相册</title>
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
</head>
<body>
<div id="app">

  <!-- ───────────────── 顶部功能栏 ───────────────── -->
  <header class="titlebar">
    <div class="tb-left">
      <div class="brand" title="Luma Album · 智能相册">
        <img class="brand-icon" src="icon.png" alt="" />
        <span>Luma</span>
      </div>
      <div class="pathchip" id="pathChip" title="尚未选择文件夹">
        <span class="dot" id="pathDot"></span>
        <span class="pathchip-text" id="pathText">未选择文件夹</span>
      </div>
      <button class="ibtn" id="btnRefresh" title="重新扫描">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M20 11a8 8 0 1 1-2.3-5.6M20 4.5V11h-6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="btn-ghost" id="btnOpen">打开文件夹</button>
    </div>

    <div class="tb-center">
      <div class="seg" id="segFilter">
        <button data-filter="all" class="on">全部</button>
        <button data-filter="image">图片</button>
        <button data-filter="video">视频</button>
        <button data-filter="live">实况</button>
        <button data-filter="audio" hidden>音频</button>
        <button data-filter="doc" hidden>文档</button>
      </div>
    </div>

    <div class="tb-right">
      <div class="search-wrap">
        <label class="search">
          <svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M15 15l4.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <input id="searchInput" type="text" placeholder="搜索名称、标签、备注" spellcheck="false" />
        </label>
        <div class="search-pop" id="searchPop" hidden></div>
      </div>
      <button class="btn-text" id="btnSlideshow">幻灯片</button>
      <button class="btn-text" id="btnMap">地图</button>
      <button class="btn-text" id="btnSelect">选择</button>
      <button class="ibtn" id="btnSettings" title="设置">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.45"/></svg>
      </button>
    </div>
  </header>

  <!-- 自绘窗口按钮：始终在内容之上，设置弹层打开时也能操作 -->
  <div class="win-controls" id="winControls" aria-label="窗口控制">
    <button class="wc-btn wc-min" id="winMin" title="最小化" aria-label="最小化">
      <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M4 8.5h8" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round"/></svg>
    </button>
    <button class="wc-btn wc-max" id="winMax" title="最大化" aria-label="最大化">
      <svg class="i-max" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><rect x="4.4" y="4.4" width="7.2" height="7.2" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.15"/></svg>
      <svg class="i-restore" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><rect x="5.6" y="3.4" width="7" height="7" rx="1.1" fill="none" stroke="currentColor" stroke-width="1.15"/><path d="M3.6 6v5.4a1 1 0 0 0 1 1H10" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round"/></svg>
    </button>
    <button class="wc-btn wc-close" id="winClose" title="关闭" aria-label="关闭">
      <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M4.8 4.8l6.4 6.4M11.2 4.8L4.8 11.2" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round"/></svg>
    </button>
  </div>

  <!-- ───────────────── 左侧导航区 ───────────────── -->
  <aside class="sidebar">
    <div class="side-scroll" id="sideScroll"></div>
  </aside>

  <!-- ───────────────── 中间素材展示区 ───────────────── -->
  <main class="stage">
    <div class="stage-head">
      <div class="crumb" id="crumb">全部素材</div>
      <div class="stage-tools">
        <div class="sort-wrap">
          <button class="sort-btn" id="btnSort" aria-haspopup="true" title="排序方式">
            <span id="sortLabel">日期 · 新→旧</span>
            <svg viewBox="0 0 24 24" width="10" height="10" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="sort-menu" id="sortMenu" hidden></div>
        </div>
        <span class="count" id="countText">0 项</span>
        <div class="zoom" title="滚轮也可缩放">
          <svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="14" y="3" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="3" y="14" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="14" y="14" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
          <input id="zoom" type="range" min="100" max="280" step="4" value="168" />
        </div>
      </div>
    </div>

    <div class="stage-body" id="stageBody">
      <div class="grid" id="grid"></div>
      <div class="sentinel" id="sentinel"></div>

      <div class="empty" id="empty" hidden>
        <svg viewBox="0 0 120 120" width="96" height="96" aria-hidden="true">
          <rect x="16" y="26" width="88" height="70" rx="10" fill="#f4f4f6"/>
          <circle cx="40" cy="48" r="7" fill="#dfdfe4"/>
          <path d="M20 88l26-26 16 15 12-11 26 24" stroke="#dfdfe4" stroke-width="4" fill="none" stroke-linejoin="round"/>
        </svg>
        <div class="empty-t" id="emptyTitle">还没有素材</div>
        <div class="empty-s" id="emptySub">打开一个文件夹或压缩包，开始整理你的图片、视频与实况</div>
        <button class="btn-primary" id="btnEmptyOpen">打开文件夹或压缩包</button>
      </div>

      <div class="loading" id="loading" hidden>
        <div class="spinner"></div>
        <div class="loading-text" id="loadingText">正在扫描…</div>
      </div>
    </div>

    <div class="drop-hint" id="dropHint">松开即可打开此文件夹或压缩包</div>

    <!-- 右侧信息栏折叠按钮：贴在内容区右边缘，收起后仍可直接打开 -->
    <button class="ins-toggle" id="insToggle" title="收起信息栏" aria-label="收起信息栏">
      <svg class="ins-toggle-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.6" y="4.4" width="16.8" height="15.2" rx="3.4" fill="none" stroke="currentColor" stroke-width="1.45"/><path d="M14.6 4.9v14.2" fill="none" stroke="currentColor" stroke-width="1.15" opacity=".38"/><path class="ins-chev" d="M9.2 9.4l2.7 2.6-2.7 2.6" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </main>

  <!-- ───────────────── 右侧信息详情区 ───────────────── -->
  <aside class="inspector" id="inspector"></aside>

  <!-- 侧栏宽度拖拽 -->
  <div class="side-resizer left" id="resizeSide" title="拖动调整左侧栏宽度"></div>
  <div class="side-resizer right" id="resizeIns" title="拖动调整右侧信息栏宽度"></div>

  <!-- 批量操作条 -->
  <div class="batchbar" id="batchbar" hidden></div>

  <!-- 足迹地图 -->
  <div class="mapview" id="mapView" hidden>
    <header class="map-head">
      <button class="map-back" id="mapBack">返回</button>
      <div class="map-title">足迹地图</div>
      <div class="map-sub" id="mapSub"></div>
    </header>
    <div class="map-body">
      <div class="map-el" id="mapEl"></div>
      <div class="map-tip" id="mapTip">点击照片查看详情</div>
    </div>
  </div>

  <!-- 智能识别 -->
  <div class="aiview" id="aiView" hidden>
    <header class="map-head">
      <button class="map-back" id="aiBack">返回</button>
      <div class="map-title">智能识别</div>
      <div class="map-sub" id="aiSub"></div>
    </header>
    <div class="ai-body">
      <div class="ai-inner" id="aiInner"></div>
    </div>
  </div>

  <!-- 全屏预览 -->
  <div class="viewer" id="viewer" hidden></div>

  <!-- 弹层 -->
  <div class="modal-root" id="modalRoot" hidden></div>

  <div class="toast" id="toast" hidden></div>
</div>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/pdfjs/pdf.min.js"></script>
<script src="app.js"></script>
</body>
</html>
